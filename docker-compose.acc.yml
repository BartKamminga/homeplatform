# docker-compose.acc.yml - acceptatie op G4 (develop-branch, poort 8081). Gedeelde definities: docker-compose.base.yml.
# Start vanuit /home/bart/homeplatform-repo-acc; images worden hier lokaal gebouwd.
# Alle data in /home/bart/homeplatform-acc, behalve de muziek: die NAS-share is op G4 nog gemount onder het oude
# prod-pad /home/bart/homeplatform/music (verplaatsen vraagt sudo/fstab, item 1189).

services:
  caddy_acc:
    extends: { file: docker-compose.base.yml, service: caddy }
    container_name: homeplatform_caddy_acc
    ports:
      - "8081:80"
    volumes:
      - caddy_acc_data:/data
      - caddy_acc_config:/config
      # /yearof/ los van de image, bijwerken met publish-yearof.ps1
      - /home/bart/homeplatform-acc/static/yearof:/srv/static/yearof:ro
      # Thuis-IP voor acc.webheaven.nl, bijgehouden door scripts/acc-home-ip.sh (item 1191)
      - /home/bart/homeplatform-acc/caddy-allow:/etc/caddy/allow:ro
      # Toegang acc.webheaven.nl: alleen LAN, thuis-IP en ACC_ALLOWED_IPS (item 1191)
      - ./docker/web/acc-guard.caddy:/etc/caddy/guard/acc.caddy:ro
    environment:
      - BACKEND_UPSTREAM=backend_acc:8000
      # Toegestane IP's voor acc.webheaven.nl naast het LAN (docker/web/acc-guard.caddy, item 1191)
      - ACC_ALLOWED_IPS=${ACC_ALLOWED_IPS:-}
    depends_on:
      - backend_acc

  backend_acc:
    extends: { file: docker-compose.base.yml, service: backend }
    container_name: homeplatform_backend_acc
    volumes:
      - /home/bart/homeplatform-acc/db:/app/db
      - /home/bart/homeplatform-acc/uploads:/app/uploads
      - /home/bart/homeplatform-acc/nas-files:/app/nas-files
      - /home/bart/homeplatform/music:/app/music
      - /home/bart/homeplatform/music/downloads:/app/downloads
      - /home/bart/homeplatform-acc/beatportdl-config:/app/beatportdl-config
      - /home/bart/homeplatform-acc/plugins:/app/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ./MindBox.ps1:/app/MindBox.ps1:ro
      - /etc/hostname:/etc/host_hostname:ro
    environment:
      - ENVIRONMENT=acceptatie
      - PROD_API_BASE=${PROD_API_BASE:-}
      - PROD_API_KEY=${PROD_API_KEY:-}
      - DEV_SESSION_DEPLOY_KEY_HOST_PATH=${DEV_SESSION_DEPLOY_KEY_HOST_PATH:-/home/bart/homeplatform-acc/secrets/claude-agent-deploy-key}
      - DEV_SESSION_UPLOADS_HOST_PATH=${DEV_SESSION_UPLOADS_HOST_PATH:-/home/bart/homeplatform-acc/uploads}

  ghost_acc:
    extends: { file: docker-compose.base.yml, service: ghost }
    container_name: homeplatform_ghost_acc
    environment:
      - GHOST_API_BASE=http://backend_acc:8000
    depends_on:
      - backend_acc

  agent_worker_acc:
    extends: { file: docker-compose.base.yml, service: agent_worker }
    container_name: homeplatform_agent_worker_acc
    environment:
      - AGENT_API_BASE=http://backend_acc:8000
    depends_on:
      - backend_acc

volumes:
  caddy_acc_data:
  caddy_acc_config:
