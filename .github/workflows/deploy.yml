name: Deploy HomePlatform

on:
  push:
    branches: [main, develop]

env:
  PROD_REPO: /home/bart/homeplatform-repo
  ACC_REPO:  /home/bart/homeplatform-repo-acc

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, g4]
    steps:
      - name: Pull
        run: git -C $PROD_REPO pull

      - name: Backend bouwen en herstarten
        working-directory: ${{ env.PROD_REPO }}
        run: |
          docker compose -f docker-compose.g4.yml build backend ghost agent_worker
          docker compose -f docker-compose.g4.yml up -d backend ghost agent_worker
          sleep 5

      - name: Migraties + seed
        run: |
          docker exec homeplatform_backend sh -c "alembic heads 2>&1; alembic current 2>&1" || true
          docker exec homeplatform_backend alembic upgrade heads || { echo "Alembic upgrade FAILED — deploy afgebroken"; exit 1; }
          docker exec homeplatform_backend python seed.py

      - name: Frontend bouwen
        run: |
          chmod -R u+w $PROD_REPO/frontend/dist 2>/dev/null || true
          cd $PROD_REPO/frontend && npm ci --prefer-offline
          cd $PROD_REPO/frontend/sites && npm ci --prefer-offline && npm run build

      - name: Caddy reload
        run: |
          cd $PROD_REPO && docker compose -f docker-compose.g4.yml up -d --force-recreate caddy

      - name: Deploy-info schrijven
        run: |
          COMMIT=$(git -C $PROD_REPO rev-parse HEAD)
          SHORT=${COMMIT:0:7}
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"commit\":\"$COMMIT\",\"short\":\"$SHORT\",\"deployed_at\":\"$TS\",\"env\":\"prod\"}" > /home/bart/homeplatform/db/deploy_info.json

  deploy-acc:
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, g4]
    steps:
      - name: Pull (acc)
        run: |
          if [ ! -d "$ACC_REPO" ]; then
            git clone -b develop https://github.com/BartKamminga/homeplatform.git $ACC_REPO
            cp $PROD_REPO/.env $ACC_REPO/.env
          else
            git -C $ACC_REPO pull
          fi

      - name: Backend bouwen en herstarten (acc)
        run: |
          mkdir -p $ACC_REPO/frontend/dist
          mkdir -p /home/bart/homeplatform-acc/db
          mkdir -p /home/bart/homeplatform-acc/uploads
          mkdir -p /home/bart/homeplatform-acc/nas-files
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml build backend_acc ghost_acc agent_worker_acc
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml up -d
          sleep 5

      - name: Migraties + seed (acc)
        run: |
          docker exec homeplatform_backend_acc sh -c "
            set -e
            echo '=== alembic heads (scripts) ===' && alembic heads 2>&1 || true
            echo '=== alembic current (db) ===' && alembic current 2>&1 || true
            if ! alembic current 2>/dev/null | grep -q '.'; then
              echo 'Fresh DB — stamp at baseline'
              alembic stamp fade12ab34cd
            fi
            alembic upgrade heads
            python seed.py
          "

      - name: Frontend bouwen (acc)
        run: |
          chmod -R u+w $ACC_REPO/frontend/dist 2>/dev/null || true
          cd $ACC_REPO/frontend && npm ci --prefer-offline
          cd $ACC_REPO/frontend/sites && npm ci --prefer-offline && npm run build

      - name: Caddy reload (acc)
        run: |
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml up -d --force-recreate caddy_acc

      - name: Deploy-info schrijven (acc)
        run: |
          COMMIT=$(git -C $ACC_REPO rev-parse HEAD)
          SHORT=${COMMIT:0:7}
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"commit\":\"$COMMIT\",\"short\":\"$SHORT\",\"deployed_at\":\"$TS\",\"env\":\"acceptatie\"}" > /home/bart/homeplatform-acc/db/deploy_info.json
