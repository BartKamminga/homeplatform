name: Deploy HomePlatform

on:
  push:
    branches: [main, develop]

env:
  PROD_REPO: /home/bart/homeplatform-repo
  ACC_REPO:  /home/bart/homeplatform-repo-acc

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, g4]
    steps:
      - name: Pull
        run: git -C $PROD_REPO pull

      - name: Backend bouwen en herstarten
        working-directory: ${{ env.PROD_REPO }}
        run: |
          docker compose -f docker-compose.g4.yml build backend
          docker compose -f docker-compose.g4.yml restart backend
          sleep 5

      - name: Migraties + seed
        run: |
          docker exec homeplatform_backend alembic upgrade head
          docker exec homeplatform_backend python seed.py

      - name: Frontend bouwen
        working-directory: ${{ env.PROD_REPO }}/frontend
        run: npm ci --prefer-offline && npm run build

      - name: Caddy reload
        run: docker exec homeplatform_caddy caddy reload --config /etc/caddy/Caddyfile

  deploy-acc:
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, g4]
    steps:
      - name: Pull (acc)
        run: |
          if [ ! -d "$ACC_REPO" ]; then
            git clone -b develop https://github.com/BartKamminga/homeplatform.git $ACC_REPO
            cp $PROD_REPO/.env $ACC_REPO/.env
          else
            git -C $ACC_REPO pull
          fi

      - name: Backend bouwen en herstarten (acc)
        working-directory: ${{ env.ACC_REPO }}
        run: |
          docker compose -f docker-compose.acc.yml build backend_acc
          docker compose -f docker-compose.acc.yml up -d
          sleep 5

      - name: Migraties + seed (acc)
        run: |
          docker exec homeplatform_backend_acc alembic upgrade head
          docker exec homeplatform_backend_acc python seed.py

      - name: Frontend bouwen (acc)
        working-directory: ${{ env.ACC_REPO }}/frontend
        run: npm ci --prefer-offline && npm run build

      - name: Caddy reload (acc)
        run: docker exec homeplatform_caddy_acc caddy reload --config /etc/caddy/Caddyfile
