name: Deploy HomePlatform

on:
  push:
    branches: [main, develop]

env:
  PROD_REPO: /home/bart/homeplatform-repo
  ACC_REPO:  /home/bart/homeplatform-repo-acc

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, g4]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pull
        run: git -C $PROD_REPO pull

      - name: GHCR inloggen
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Images bouwen en pushen
        working-directory: ${{ env.PROD_REPO }}
        run: |
          export IMAGE_TAG=$(git rev-parse --short HEAD)
          docker compose -f docker-compose.g4.yml build backend ghost agent_worker
          docker compose -f docker-compose.g4.yml push backend ghost agent_worker

      - name: Frontend bouwen
        working-directory: ${{ env.PROD_REPO }}
        run: |
          chmod -R u+w frontend/dist 2>/dev/null || true
          cd frontend && npm ci --prefer-offline
          cd sites && npm ci --prefer-offline && npm run build

      - name: Frontend naar g5 kopieren
        run: |
          ssh -i /home/bart/.ssh/homeplatform-g5 bart@192.168.30.49 "mkdir -p /home/bart/homeplatform-repo/frontend/dist"
          rsync -az --delete -e "ssh -i /home/bart/.ssh/homeplatform-g5" \
            $PROD_REPO/frontend/dist/ bart@192.168.30.49:/home/bart/homeplatform-repo/frontend/dist/

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: [self-hosted, g5]
    environment: production
    steps:
      - name: Pull
        run: |
          if [ ! -d "$PROD_REPO/.git" ]; then
            # init+fetch i.p.v. clone: build-and-push heeft frontend/dist al aangemaakt
            # (rsync-stap), dus de map is niet per se leeg - clone zou daarop stuklopen.
            mkdir -p $PROD_REPO
            git -C $PROD_REPO init -b main
            git -C $PROD_REPO remote add origin https://github.com/BartKamminga/homeplatform.git
            git -C $PROD_REPO fetch origin main
            git -C $PROD_REPO reset --hard origin/main
          else
            git -C $PROD_REPO pull
          fi

      - name: .env genereren (production-environment secrets)
        run: |
          cat > $PROD_REPO/.env << 'EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          NAS_URL=${{ secrets.NAS_URL }}
          EXTERNAL_URL=${{ secrets.EXTERNAL_URL }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
          CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GHOST_API_KEY=${{ secrets.GHOST_API_KEY }}
          HOCKEY_EMAIL=${{ secrets.HOCKEY_EMAIL }}
          HOCKEY_PASSWORD=${{ secrets.HOCKEY_PASSWORD }}
          AGENT_WORKER_API_KEY=${{ secrets.AGENT_WORKER_API_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          BUGSINK_DB_PASSWORD=${{ secrets.BUGSINK_DB_PASSWORD }}
          BUGSINK_SECRET_KEY=${{ secrets.BUGSINK_SECRET_KEY }}
          BUGSINK_SUPERUSER=${{ secrets.BUGSINK_SUPERUSER }}
          EOF
          chmod 600 $PROD_REPO/.env

      - name: GHCR inloggen
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Images pullen en herstarten
        working-directory: ${{ env.PROD_REPO }}
        run: |
          export IMAGE_TAG=$(git rev-parse --short HEAD)
          docker compose -f docker-compose.g4.yml pull backend ghost agent_worker
          docker compose -f docker-compose.g4.yml up -d --force-recreate backend ghost agent_worker
          sleep 5

      - name: Migraties + seed
        run: |
          docker exec homeplatform_backend sh -c "alembic heads 2>&1; alembic current 2>&1" || true
          docker exec homeplatform_backend alembic upgrade heads || { echo "Alembic upgrade FAILED — deploy afgebroken"; exit 1; }
          docker exec homeplatform_backend python seed.py

      - name: Caddy reload
        run: |
          cd $PROD_REPO && docker compose -f docker-compose.g4.yml up -d --force-recreate caddy

      - name: Deploy-info schrijven
        run: |
          COMMIT=$(git -C $PROD_REPO rev-parse HEAD)
          SHORT=${COMMIT:0:7}
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"commit\":\"$COMMIT\",\"short\":\"$SHORT\",\"deployed_at\":\"$TS\",\"env\":\"prod\"}" > /home/bart/homeplatform/db/deploy_info.json

  deploy-acc:
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, g4]
    environment: acceptance
    steps:
      - name: Pull (acc)
        run: |
          if [ ! -d "$ACC_REPO" ]; then
            git clone -b develop https://github.com/BartKamminga/homeplatform.git $ACC_REPO
          else
            git -C $ACC_REPO pull
          fi

      - name: .env genereren (acceptance-environment secrets)
        run: |
          cat > $ACC_REPO/.env << 'EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          NAS_URL=${{ secrets.NAS_URL }}
          EXTERNAL_URL=${{ secrets.EXTERNAL_URL }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
          CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GHOST_API_KEY=${{ secrets.GHOST_API_KEY }}
          HOCKEY_EMAIL=${{ secrets.HOCKEY_EMAIL }}
          HOCKEY_PASSWORD=${{ secrets.HOCKEY_PASSWORD }}
          AGENT_WORKER_API_KEY=${{ secrets.AGENT_WORKER_API_KEY }}
          PROD_API_BASE=${{ secrets.PROD_API_BASE }}
          PROD_API_KEY=${{ secrets.PROD_API_KEY }}
          EOF
          chmod 600 $ACC_REPO/.env

      - name: Backend bouwen en herstarten (acc)
        run: |
          mkdir -p $ACC_REPO/frontend/dist
          mkdir -p /home/bart/homeplatform-acc/db
          mkdir -p /home/bart/homeplatform-acc/uploads
          mkdir -p /home/bart/homeplatform-acc/nas-files
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml build backend_acc ghost_acc agent_worker_acc
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml up -d --force-recreate backend_acc ghost_acc agent_worker_acc
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml up -d
          sleep 5

      - name: Migraties + seed (acc)
        run: |
          docker exec homeplatform_backend_acc sh -c "
            set -e
            echo '=== alembic heads (scripts) ===' && alembic heads 2>&1 || true
            echo '=== alembic current (db) ===' && alembic current 2>&1 || true
            if ! alembic current 2>/dev/null | grep -q '.'; then
              echo 'Fresh DB — stamp at baseline'
              alembic stamp fade12ab34cd
            fi
            alembic upgrade heads
            python seed.py
          "

      - name: Frontend bouwen (acc)
        run: |
          chmod -R u+w $ACC_REPO/frontend/dist 2>/dev/null || true
          cd $ACC_REPO/frontend && npm ci --prefer-offline
          cd $ACC_REPO/frontend/sites && npm ci --prefer-offline && npm run build

      - name: Caddy reload (acc)
        run: |
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml up -d --force-recreate caddy_acc

      - name: Deploy-info schrijven (acc)
        run: |
          COMMIT=$(git -C $ACC_REPO rev-parse HEAD)
          SHORT=${COMMIT:0:7}
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"commit\":\"$COMMIT\",\"short\":\"$SHORT\",\"deployed_at\":\"$TS\",\"env\":\"acceptatie\"}" > /home/bart/homeplatform-acc/db/deploy_info.json
