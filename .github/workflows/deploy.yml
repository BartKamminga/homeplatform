name: Deploy HomePlatform

on:
  push:
    branches: [main, develop]

env:
  PROD_REPO: /home/bart/homeplatform-repo
  ACC_REPO:  /home/bart/homeplatform-repo-acc
  PROD_DB:   /home/bart/homeplatform/db/homeplatform.sqlite
  ACC_DB:    /home/bart/homeplatform-acc/db/homeplatform.sqlite
  # Geen provenance-attestaties: één manifest per image, zodat GHCR-versies = tags (opschonen blijft simpel).
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # Prod: G4 bouwt alle images (backend, ghost, agent_worker, web = caddy + frontend) en pusht naar GHCR.
  # Bouwt in de eigen runner-workspace, niet in een repo die ergens live geserveerd wordt.
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, g4]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image-tag bepalen
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: GHCR inloggen
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Images bouwen en pushen
        run: |
          docker compose -f docker-compose.g4.yml build backend ghost agent_worker caddy
          docker compose -f docker-compose.g4.yml push backend ghost agent_worker caddy

  # Prod: g5 haalt de images op. Volgorde: pull -> db-snapshot -> backend/ghost/agent_worker ->
  # migraties -> pas dan web. Faalt een migratie, dan blijft de oude frontend gewoon draaien.
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: [self-hosted, g5]
    environment: production
    steps:
      - name: Pull
        run: |
          # g5 heeft alleen de compose-file, scripts en MindBox.ps1 uit de repo nodig - geen build.
          if [ ! -d "$PROD_REPO/.git" ]; then
            mkdir -p $PROD_REPO
            git -C $PROD_REPO init -b main
            git -C $PROD_REPO remote add origin https://github.com/BartKamminga/homeplatform.git
          fi
          # fetch + reset naar exact deze commit (geen pull: init-repo heeft geen tracking-branch,
          # en origin/main kan intussen verder zijn). Untracked (.env) blijft staan.
          git -C $PROD_REPO fetch origin main
          git -C $PROD_REPO reset --hard $GITHUB_SHA

      - name: Image-tag bepalen
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: .env genereren (production-environment secrets)
        run: |
          cat > $PROD_REPO/.env << 'EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          NAS_URL=${{ secrets.NAS_URL }}
          EXTERNAL_URL=${{ secrets.EXTERNAL_URL }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
          CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GHOST_API_KEY=${{ secrets.GHOST_API_KEY }}
          HOCKEY_EMAIL=${{ secrets.HOCKEY_EMAIL }}
          HOCKEY_PASSWORD=${{ secrets.HOCKEY_PASSWORD }}
          AGENT_WORKER_API_KEY=${{ secrets.AGENT_WORKER_API_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          BUGSINK_DB_PASSWORD=${{ secrets.BUGSINK_DB_PASSWORD }}
          BUGSINK_SECRET_KEY=${{ secrets.BUGSINK_SECRET_KEY }}
          BUGSINK_SUPERUSER=${{ secrets.BUGSINK_SUPERUSER }}
          INFRA_PEER_TOKEN=${{ secrets.INFRA_PEER_TOKEN }}
          EOF
          chmod 600 $PROD_REPO/.env

      - name: GHCR inloggen
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Images pullen
        working-directory: ${{ env.PROD_REPO }}
        run: docker compose -f docker-compose.g4.yml pull backend ghost agent_worker caddy

      - name: DB-snapshot (voor migraties)
        run: bash $PROD_REPO/scripts/db-snapshot-predeploy.sh $PROD_DB $IMAGE_TAG

      - name: Backend herstarten
        working-directory: ${{ env.PROD_REPO }}
        run: |
          docker compose -f docker-compose.g4.yml up -d --force-recreate backend ghost agent_worker
          sleep 5

      - name: Migraties + seed
        run: |
          docker exec homeplatform_backend sh -c "alembic heads 2>&1; alembic current 2>&1" || true
          docker exec homeplatform_backend alembic upgrade heads || { echo "Alembic upgrade FAILED — deploy afgebroken, snapshot staat in db/backups/"; exit 1; }
          docker exec homeplatform_backend python seed.py

      - name: Web (caddy + frontend) herstarten
        working-directory: ${{ env.PROD_REPO }}
        # --no-deps: anders maakt compose via depends_on ook de backend opnieuw aan.
        run: docker compose -f docker-compose.g4.yml up -d --no-deps --force-recreate caddy

      - name: Controle draaiende images
        run: |
          docker ps --format "{{.Names}}\t{{.Image}}" | grep homeplatform_
          for c in homeplatform_backend homeplatform_ghost homeplatform_agent_worker homeplatform_caddy; do
            img=$(docker inspect -f '{{.Config.Image}}' $c)
            case "$img" in *":$IMAGE_TAG") ;; *) echo "FOUT: $c draait $img, verwacht :$IMAGE_TAG"; exit 1 ;; esac
          done

      - name: Deploy-info schrijven
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"commit\":\"$GITHUB_SHA\",\"short\":\"$IMAGE_TAG\",\"deployed_at\":\"$TS\",\"env\":\"prod\"}" > /home/bart/homeplatform/db/deploy_info.json

  # Oude image-versies in GHCR opruimen; laatste 20 per image blijven staan (rollback-ruimte).
  cleanup-ghcr:
    if: github.ref == 'refs/heads/main'
    needs: deploy-prod
    runs-on: [self-hosted, g4]
    continue-on-error: true
    permissions:
      packages: write
    strategy:
      matrix:
        package: [homeplatform-backend, homeplatform-ghost, homeplatform-agent-worker, homeplatform-web]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20

  # Acc: bouwt lokaal op G4 met hetzelfde web-Dockerfile als prod (met Caddyfile.acc).
  deploy-acc:
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, g4]
    environment: acceptance
    steps:
      - name: Pull (acc)
        run: |
          if [ ! -d "$ACC_REPO" ]; then
            git clone -b develop https://github.com/BartKamminga/homeplatform.git $ACC_REPO
          fi
          git -C $ACC_REPO fetch origin develop
          git -C $ACC_REPO reset --hard $GITHUB_SHA

      - name: .env genereren (acceptance-environment secrets)
        run: |
          cat > $ACC_REPO/.env << 'EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          NAS_URL=${{ secrets.NAS_URL }}
          EXTERNAL_URL=${{ secrets.EXTERNAL_URL }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
          CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GHOST_API_KEY=${{ secrets.GHOST_API_KEY }}
          HOCKEY_EMAIL=${{ secrets.HOCKEY_EMAIL }}
          HOCKEY_PASSWORD=${{ secrets.HOCKEY_PASSWORD }}
          AGENT_WORKER_API_KEY=${{ secrets.AGENT_WORKER_API_KEY }}
          PROD_API_BASE=${{ secrets.PROD_API_BASE }}
          PROD_API_KEY=${{ secrets.PROD_API_KEY }}
          INFRA_PEER_TOKEN=${{ secrets.INFRA_PEER_TOKEN }}
          EOF
          chmod 600 $ACC_REPO/.env

      - name: Images bouwen (acc)
        run: |
          mkdir -p /home/bart/homeplatform-acc/db
          mkdir -p /home/bart/homeplatform-acc/uploads
          mkdir -p /home/bart/homeplatform-acc/nas-files
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml build backend_acc ghost_acc agent_worker_acc caddy_acc

      - name: DB-snapshot (acc, voor migraties)
        run: bash $ACC_REPO/scripts/db-snapshot-predeploy.sh $ACC_DB ${GITHUB_SHA::7}

      - name: Backend herstarten (acc)
        run: |
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml up -d --force-recreate backend_acc ghost_acc agent_worker_acc
          sleep 5

      - name: Migraties + seed (acc)
        run: |
          docker exec homeplatform_backend_acc sh -c "
            set -e
            echo '=== alembic heads (scripts) ===' && alembic heads 2>&1 || true
            echo '=== alembic current (db) ===' && alembic current 2>&1 || true
            if ! alembic current 2>/dev/null | grep -q '.'; then
              echo 'Fresh DB — stamp at baseline'
              alembic stamp fade12ab34cd
            fi
            alembic upgrade heads
            python seed.py
          "

      - name: Web (caddy + frontend) herstarten (acc)
        run: |
          cd $ACC_REPO && docker compose -f docker-compose.acc.yml up -d --no-deps --force-recreate caddy_acc

      - name: Deploy-info schrijven (acc)
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"commit\":\"$GITHUB_SHA\",\"short\":\"${GITHUB_SHA::7}\",\"deployed_at\":\"$TS\",\"env\":\"acceptatie\"}" > /home/bart/homeplatform-acc/db/deploy_info.json
