# docker-compose.g4.yml
# HP ProDesk G4 configuratie
# Gebruik: docker compose -f docker-compose.g4.yml up --build -d

services:
  caddy:
    image: caddy:latest
    container_name: homeplatform_caddy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv/www
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeplatform_backend
    volumes:
      - /home/bart/homeplatform/db:/app/db
      - /home/bart/homeplatform/uploads:/app/uploads
      - /home/bart/homeplatform/nas-files:/app/nas-files
      - /home/bart/homeplatform/music:/app/music
      - /home/bart/homeplatform/music/downloads:/app/downloads
      - /home/bart/homeplatform/beatportdl-config:/app/beatportdl-config
      - /home/bart/homeplatform/plugins:/app/plugins
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./MindBox.ps1:/app/MindBox.ps1:ro
    environment:
      - DATABASE_URL=sqlite:///./db/homeplatform.sqlite
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - MUSIC_DIR=/app/music/music/mixes
      - DOWNLOAD_DIR=/app/downloads
      - BEATPORTDL_CONFIG_DIR=/app/beatportdl-config
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NAS_URL=${NAS_URL:-}
      - EXTERNAL_URL=${EXTERNAL_URL:-}
      - WORKER_POLL_IDLE_SEC=300
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ghost:
    build:
      context: ./plugins/ghost
      dockerfile: Dockerfile
    container_name: homeplatform_ghost
    shm_size: "1gb"
    environment:
      - GHOST_API_BASE=http://backend:8000
      - GHOST_API_KEY=${GHOST_API_KEY}
      - HOCKEY_EMAIL=${HOCKEY_EMAIL}
      - HOCKEY_PASSWORD=${HOCKEY_PASSWORD}
    depends_on:
      - backend
    restart: unless-stopped

  agent_worker:
    build:
      context: ./plugins/agent-worker
      dockerfile: Dockerfile
    container_name: homeplatform_agent_worker
    environment:
      - AGENT_API_BASE=http://backend:8000
      - AGENT_API_KEY=${AGENT_WORKER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WORKER_POLL_IDLE_SEC=300
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homeplatform_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

  bugsink_db:
    image: postgres:17-alpine
    container_name: bugsink_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bugsink
      - POSTGRES_PASSWORD=${BUGSINK_DB_PASSWORD}
      - POSTGRES_DB=bugsink
    volumes:
      - bugsink_db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h bugsink_db
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  bugsink:
    image: bugsink/bugsink:2
    container_name: bugsink
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - SECRET_KEY=${BUGSINK_SECRET_KEY}
      - DATABASE_URL=postgresql://bugsink:${BUGSINK_DB_PASSWORD}@bugsink_db:5432/bugsink
      - PORT=8090
      - BEHIND_HTTPS_PROXY=false
      - CREATE_SUPERUSER=${BUGSINK_SUPERUSER:-}
    depends_on:
      bugsink_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8090/health/ready\").raise_for_status()'"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  bugsink_db:
